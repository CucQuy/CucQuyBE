name: Build & Push Backend

# Push lên main → build image trên runner GitHub → push GHCR.
# KHÔNG deploy ở đây nữa: Keel (trong k3s @ ricevps) tự poll ghcr,
# thấy :latest đổi digest là tự rollout (pull-based, không cần SSH).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/cucquy/cucquy-backend

jobs:
  # 1) CI — gate nhanh: code biên dịch được không
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit

  # 2) Build image + push lên GitHub Container Registry (GHCR)
  build-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
