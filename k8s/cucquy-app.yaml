# ---------- Redis ----------
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: cucquy }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: cucquy }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
# ---------- Backend (api.cucquy.site) ----------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cucquy
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 1m"

spec:
  replicas: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      imagePullSecrets: [{ name: ghcr }]
      containers:
        - name: backend
          image: ghcr.io/cucquy/cucquy-backend:latest
          ports: [{ containerPort: 3000 }]
          envFrom: [{ secretRef: { name: cucquy-backend-env } }]
          volumeMounts:
            - { name: sa, mountPath: /app/service_account.json, subPath: service_account.json, readOnly: true }
      volumes:
        - name: sa
          secret: { secretName: cucquy-sa, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cucquy
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 1m"

spec:
  selector: { app: backend }
  ports: [{ port: 3000, targetPort: 3000 }]
