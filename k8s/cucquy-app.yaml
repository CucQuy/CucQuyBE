# ---------- Ingress (3 domain) ----------
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: cucquy, namespace: cucquy }
spec:
  ingressClassName: traefik
  rules:
    - host: api.cucquy.site
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: backend, port: { number: 3000 } } } }] }
    - host: admin.cucquy.site
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }] }
    - host: cucquy.site
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: landing, port: { number: 80 } } } }] }
