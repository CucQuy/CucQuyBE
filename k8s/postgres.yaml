apiVersion: v1
kind: Secret
metadata:
  name: cucquy-postgres
  namespace: cucquy
type: Opaque
stringData:
  POSTGRES_USER: cucquy
  POSTGRES_PASSWORD: cucquypg2026secret
  POSTGRES_DB: cucquy
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: cucquy
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cucquy
spec:
  replicas: 1
  strategy:
    type: Recreate   # PVC RWO — không chạy 2 pod cùng lúc
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: cucquy-postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U cucquy -d cucquy"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cucquy
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
