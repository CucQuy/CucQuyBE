# MQTT broker (Mosquitto + mosquitto-go-auth) trên k3s @ ricevps.
# Auth/ACL ĐỘNG qua RiceService (service MQTT đăng ký được): broker gọi HTTP
#   backend.rice.svc.cluster.local:9100 /mqtt/{auth,acl} mỗi lần CONNECT/publish.
# → credential quản lý ở RiceService (đăng ký per-tenant), KHÔNG còn password_file tĩnh.
# Public WSS: Cloudflare → cloudflared → Traefik (mqtt.cucquy.site) → svc:9001.
# Rollback: apply lại bản eclipse-mosquitto trước đó (git history) nếu go-auth lỗi.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mqtt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mqtt
data:
  mosquitto.conf: |
    persistence false
    log_dest stdout
    log_type warning
    log_type notice
    log_type information
    connection_messages true

    per_listener_settings false
    allow_anonymous false

    # go-auth plugin (có sẵn trong image) → HTTP backend RiceService.
    auth_plugin /mosquitto/go-auth.so
    auth_opt_backends http
    auth_opt_http_host backend.rice.svc.cluster.local
    auth_opt_http_port 9100
    auth_opt_http_getuser_uri /mqtt/auth
    auth_opt_http_aclcheck_uri /mqtt/acl
    auth_opt_http_superuser_uri /mqtt/superuser
    auth_opt_http_method POST
    auth_opt_http_params_mode json
    auth_opt_http_response_mode json
    # cache: bcrypt chỉ chạy lúc CONNECT, không gọi Rice mỗi publish.
    auth_opt_cache true
    auth_opt_cache_type go-cache
    auth_opt_auth_cache_seconds 60
    auth_opt_acl_cache_seconds 60

    listener 1883 0.0.0.0
    protocol mqtt

    listener 9001 0.0.0.0
    protocol websockets
---
# PVC giữ lại cho khả năng rollback về eclipse-mosquitto (bản go-auth KHÔNG mount).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: mqtt
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: mqtt
  labels:
    app: mosquitto
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: iegomez/mosquitto-go-auth:latest
          command: ["/usr/sbin/mosquitto"]
          args: ["-c", "/etc/mosquitto/mosquitto.conf"]
          ports:
            - { name: mqtt, containerPort: 1883 }
            - { name: ws, containerPort: 9001 }
          volumeMounts:
            - { name: config, mountPath: /etc/mosquitto/mosquitto.conf, subPath: mosquitto.conf }
          livenessProbe:
            tcpSocket: { port: 1883 }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket: { port: 1883 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "10m", memory: "48Mi" }
            limits: { memory: "192Mi" }
      volumes:
        - name: config
          configMap: { name: mosquitto-config }
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: mqtt
  labels:
    app: mosquitto
spec:
  selector:
    app: mosquitto
  ports:
    - { name: mqtt, port: 1883, targetPort: 1883 }
    - { name: ws, port: 9001, targetPort: 9001 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mosquitto-ws
  namespace: mqtt
spec:
  ingressClassName: traefik
  rules:
    - host: mqtt.cucquy.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mosquitto
                port:
                  number: 9001
